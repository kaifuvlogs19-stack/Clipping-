<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipper: long videos to viral shorts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap">
<style>
:root{--bg:#0D0D12;--panel:#16161D;--panel2:#1D1D26;--line:#2A2A35;--ink:#F3F3F7;--muted:#9393A3;--a:#7B5CFF;--b:#3D8BFF;--ok:#2FD08B;--warn:#FFB020}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 420px at 50% -80px,#2A1F6B 0%,transparent 70%),var(--bg);color:var(--ink);font:16px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.nav{display:flex;justify-content:space-between;align-items:center;max-width:1080px;margin:0 auto;padding:18px 20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem}
.mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--a),var(--b));display:inline-block}
.ghost{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;color:var(--muted)}
main{max-width:1080px;margin:0 auto;padding:36px 20px 90px}
.hero{text-align:center}
h1{font-size:clamp(2.2rem,7vw,4rem);line-height:1.05;letter-spacing:-.03em;font-weight:800;margin:0 auto 14px;max-width:16ch}
.grad{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:0 auto 28px;max-width:44ch}
.pill{display:flex;gap:8px;max-width:640px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px}
.pill input{flex:1;min-width:0;background:transparent;border:0;padding:10px 12px;outline:0}
.cta{background:linear-gradient(135deg,var(--a),var(--b));border:0;border-radius:11px;padding:12px 20px;font-weight:600;cursor:pointer;color:#fff;white-space:nowrap}
.cta:disabled{opacity:.55;cursor:default}
.opts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.opt{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 8px 6px 14px;font-size:.85rem;color:var(--muted)}
.opt input{width:54px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 8px;text-align:center}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;margin-top:14px;font-size:.85rem}
#srv{display:none;max-width:640px;margin:18px auto 0;text-align:left}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.card label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
#job{display:none;max-width:640px;margin:32px auto 0}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:12px;padding:8px 0;color:var(--muted)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.steps li.on{color:var(--ink)} .steps li.on .dot{border-color:var(--b);border-top-color:transparent;animation:sp 1s linear infinite}
.steps li.ok{color:var(--ink)} .steps li.ok .dot{background:var(--ok);border-color:var(--ok)}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:#FF6B6B;margin-top:12px;font-size:.9rem;white-space:pre-wrap}
#out{display:none;margin-top:44px}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}
.head h2{margin:0;font-size:1.4rem}
.head span{color:var(--muted);font-size:.9rem}
.strip{position:relative;height:30px;border-radius:8px;background:var(--panel);border:1px solid var(--line);margin-bottom:26px}
.strip b{position:absolute;top:3px;bottom:3px;min-width:5px;border-radius:5px;background:linear-gradient(135deg,var(--a),var(--b))}
.strip small{position:absolute;top:100%;margin-top:3px;font-size:.72rem;color:var(--muted)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.clip{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.vid{position:relative;aspect-ratio:9/16;background:linear-gradient(160deg,#2B2260,#12202F)}
.vid video{width:100%;height:100%;object-fit:cover;display:block}
.score{position:absolute;top:10px;left:10px;background:rgba(13,13,18,.78);backdrop-filter:blur(6px);border-radius:10px;padding:3px 9px;font-weight:800;font-size:.95rem}
.score i{font-style:normal;color:var(--ok)}
.info{padding:12px}
.info h3{margin:0 0 4px;font-size:.98rem;line-height:1.3}
.info p{margin:0 0 12px;color:var(--muted);font-size:.82rem}
.btns{display:flex;gap:8px}
.btns a,.btns button{flex:1;text-align:center;text-decoration:none;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:.85rem;font-weight:600;cursor:pointer}
@media (max-width:520px){.pill{flex-direction:column}}
@media (prefers-reduced-motion:reduce){.steps li.on .dot{animation:none}}
</style>
</head>
<body>
<header class="nav">
  <div class="logo"><span class="mark"></span>Clipper</div>
  <button class="ghost" id="setBtn">Server</button>
</header>

<main>
  <section class="hero">
    <h1>1 long video, <span class="grad">10 viral clips.</span></h1>
    <p class="sub">Paste a YouTube link. Clipper finds the best moments and cuts captioned vertical shorts in minutes.</p>
    <div class="pill">
      <input id="url" type="url" placeholder="Paste a YouTube link" aria-label="YouTube link">
      <button class="cta" id="go">Get clips</button>
    </div>
    <div class="opts">
      <label class="opt">Clips <input id="clips" type="number" min="1" max="12" value="5"></label>
      <label class="opt">Min sec <input id="min" type="number" min="10" max="90" value="20"></label>
      <label class="opt">Max sec <input id="max" type="number" min="15" max="120" value="60"></label>
    </div>
    <button class="link" id="demo">See a demo layout</button>

    <div class="card" id="srv">
      <label for="api">Server address (where Clipper's Python server is running)</label>
      <div class="row"><input id="api" placeholder="http://localhost:8000"><button class="cta" id="save">Save</button></div>
    </div>
  </section>

  <section class="card" id="job" role="status" aria-live="polite">
    <ul class="steps" id="steps"></ul>
    <div class="err" id="err"></div>
  </section>

  <section id="out">
    <div class="head"><h2>Your clips</h2><span id="count"></span></div>
    <div class="strip" id="strip"></div>
    <div id="grid"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const STEPS = ['Downloading video','Transcribing audio','Finding the best moments','Rendering clips'];
let base = '', timer, drawn = 0;
try { base = localStorage.getItem('clipper_api') || ''; } catch (e) {}
$('api').value = base;

const fmt = t => `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
const api = p => base.replace(/\/$/,'') + p;
const mk = (tag, props = {}, kids = []) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };

$('setBtn').onclick = () => { $('srv').style.display = $('srv').style.display === 'block' ? 'none' : 'block'; };
$('save').onclick = () => {
  base = $('api').value.trim();
  try { localStorage.setItem('clipper_api', base); } catch (e) {}
  $('srv').style.display = 'none';
};

function setSteps(i, done) {
  const ul = $('steps'); ul.innerHTML = '';
  STEPS.forEach((s, n) => ul.append(mk('li', {className: done || n < i ? 'ok' : n === i ? 'on' : ''}, [mk('span', {className:'dot'}), s])));
}

function reset() {
  drawn = 0; $('grid').innerHTML = ''; $('strip').innerHTML = ''; $('out').style.display = 'none'; $('err').textContent = '';
}

function fail(msg) { clearInterval(timer); $('err').textContent = msg; $('go').disabled = false; }

$('go').onclick = async () => {
  const url = $('url').value.trim();
  if (!url) return $('url').focus();
  reset(); $('go').disabled = true; $('job').style.display = 'block'; setSteps(0);
  try {
    const r = await fetch(api('/api/jobs'), {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url, clips:+$('clips').value, min_len:+$('min').value, max_len:+$('max').value})});
    if (!r.ok) throw new Error('Server returned ' + r.status);
    const {id} = await r.json();
    timer = setInterval(() => poll(id), 1500);
  } catch (e) {
    $('srv').style.display = 'block';
    fail(`Can't reach the Clipper server${base ? ' at ' + base : ''}.\nStart it with: uvicorn main:app --reload\nThen open http://localhost:8000, or enter the server address above.`);
  }
};

async function poll(id) {
  try {
    const j = await (await fetch(api('/api/jobs/' + id))).json();
    setSteps(j.progress < 20 ? 0 : j.progress < 60 ? 1 : j.progress < 65 ? 2 : 3, j.done && !j.error);
    if (j.clips.length) { $('out').style.display = 'block'; drawStrip(j); }
    while (drawn < j.clips.length) addClip(j.clips[drawn++], base);
    $('count').textContent = j.clips.length + ' clips';
    if (j.error) return fail(j.error);
    if (j.done) { clearInterval(timer); $('go').disabled = false; }
  } catch (e) { fail('Lost connection to the server.'); }
}

function drawStrip(j) {
  const s = $('strip'); s.innerHTML = '';
  j.clips.forEach(c => s.append(mk('b', {title:c.title, style:`left:${c.start/j.duration*100}%;width:${(c.end-c.start)/j.duration*100}%`})));
  s.append(mk('small', {textContent:'0:00', style:'left:0'}), mk('small', {textContent:fmt(j.duration), style:'right:0'}));
}

function addClip(c, root, demo) {
  const vid = mk('div', {className:'vid'});
  if (!demo) vid.append(mk('video', {src:root.replace(/\/$/,'') + c.url, controls:true, preload:'metadata', playsInline:true}));
  vid.append(mk('div', {className:'score'}, [String(c.score), mk('i', {textContent:' /100'})]));
  const btns = mk('div', {className:'btns'});
  if (!demo) btns.append(mk('a', {href:root.replace(/\/$/,'') + c.url, download:'clip.mp4', textContent:'Download'}));
  btns.append(mk('button', {textContent:'Copy title', onclick:() => navigator.clipboard && navigator.clipboard.writeText(c.title)}));
  $('grid').append(mk('article', {className:'clip'}, [vid, mk('div', {className:'info'}, [mk('h3', {textContent:c.title}), mk('p', {textContent:c.reason}), btns])]));
}

$('demo').onclick = () => {
  reset(); $('job').style.display = 'none'; $('out').style.display = 'block';
  const d = [[96,'The mistake everyone makes','Strong hook, clear payoff',60,100],[91,'Why this changes everything','Surprising claim up front',420,470],
             [87,'The 30-second explanation','Self-contained, quotable',900,945],[82,'What nobody tells you','Personal story with a twist',1500,1540]];
  const j = {duration:1800, clips:d.map(([score,title,reason,start,end]) => ({score,title,reason,start,end}))};
  drawStrip(j); j.clips.forEach(c => addClip(c, '', true)); $('count').textContent = 'Demo layout';
};
</script>
</body>
</html>
